name: finapp
description: Gerenciador financeiro pessoal offline-first para Android e Windows.
publish_to: "none"
version: 0.2.0-alpha+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  drift: ^2.32.0
  sqlite3: ^3.5.2
  path: ^1.9.1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  crypto: ^3.0.7
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/somia_symbol.png
    - assets/branding/somia_horizontal.png
    - assets/institutions/

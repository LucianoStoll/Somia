include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # O Flutter 3.50 marcou package:flutter/material.dart como obsoleto em favor
    # de package:material_ui. Até a migração, o aviso não deve barrar o CI.
    deprecated_member_use: ignore
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - windows/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
